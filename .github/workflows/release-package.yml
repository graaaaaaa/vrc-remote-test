name: Release package

# v0.2.0 is intentionally NOT covered by this workflow — it was released
# manually before this file was added to main, so GitHub Actions never saw
# that historical tag-push event (workflows only react to events that occur
# after they exist on the default branch). This workflow mechanically
# replicates the exact steps that were run by hand for v0.2.0.
#
# Each release also carries the Windows Bridge executable, built and attested
# by the `bridge` job below, so the installer's -ExpectedSha256 can come from
# GitHub instead of the developer's Mac (security review S8). Releases made
# before that job existed (v0.2.0) are not backfilled.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  # Restores, tests, publishes and attests the Bridge. Kept apart from
  # `release` so the code that runs during restore/build/test never holds
  # contents: write, and the publisher never holds OIDC/attestation
  # authority. Actions in this job are pinned to commit SHAs because it can
  # mint signing identities (Codex plan review, Bridge CI release, Round 1).
  #
  # bridge-tests.yml runs on every pull request that changes this file and
  # dry-runs the publish, artifact hand-off and SHA-256 check with
  # contents: read and without attestation. Keep its steps and action pins in
  # sync with this workflow (its action-pins job fails on a pin mismatch).
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Validate tag format strictly
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RAW_TAG' does not match strict vMAJOR.MINOR.PATCH format"
            exit 1
          fi

      # No credentials are persisted: nothing in this job pushes, and the
      # fetch/ls-remote calls below work anonymously against this public repo.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version and check it against the tagged package.json
        id: version
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RAW_TAG#v}"
          PKG_VERSION=$(git show "$GITHUB_SHA:package/package.json" | jq -r '.version')
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package/package.json version ($PKG_VERSION) at the tagged commit does not match tag version ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Both checks run before anything is built or attested, so this
      # workflow never signs provenance for a commit that is not on main or
      # that the tag no longer points at. Same logic as the release job.
      - name: Verify tag points at a commit already on main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag is not an ancestor of main. Refusing to build and attest an un-merged commit."
            exit 1
          fi

      - name: Verify the tag has not moved since the run started
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TRIGGERED_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
          CURRENT_COMMIT=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | \
            awk -v tag="refs/tags/$TAG" '
              $2 == tag {direct=$1}
              $2 == tag "^{}" {peeled=$1}
              END {print (peeled != "") ? peeled : direct}
            ')
          if [ "$CURRENT_COMMIT" != "$TRIGGERED_COMMIT" ]; then
            echo "::error::Tag $TAG now resolves to '$CURRENT_COMMIT', not $TRIGGERED_COMMIT. Refusing to attest a build for a moved tag."
            exit 1
          fi

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: dotnet test
        run: dotnet test bridge/VRCRemoteTest.Bridge.sln --configuration Release

      # Not reproducible byte-for-byte (the SDK patch and restored packages
      # can change between runs), which is why the release job never accepts
      # a rebuilt executable in place of an already published one.
      - name: Publish the win-x64 single-file executable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish bridge/src/VRCRemoteTest.Bridge/VRCRemoteTest.Bridge.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION" -o dist/bridge

      - name: Compute SHA-256
        id: hash
        run: |
          EXE=dist/bridge/VRCRemoteTest.Bridge.exe
          test -f "$EXE"
          SHA256=$(sha256sum "$EXE" | cut -d' ' -f1)
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected SHA-256 output: '$SHA256'"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/bridge/VRCRemoteTest.Bridge.exe

      # Only the executable, never the workspace. Kept for 7 days so that
      # "Re-run failed jobs" can retry publishing these exact bytes.
      - name: Upload the executable for the release job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bridge-exe
          path: dist/bridge/VRCRemoteTest.Bridge.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Validated before checkout, straight off the raw ref name — no repo
      # content is needed for this check. Every value derived from the tag
      # is threaded through `env:` (never `${{ }}` inside a `run:` body)
      # from here on, so a tag name can never be spliced into a shell
      # command before bash gets to parse it (git tag names are allowed to
      # contain shell metacharacters like `` ` `` / `$()` — confirmed via
      # git-check-ref-format; a glob trigger like `v*.*.*` does not exclude
      # them either — Codex code review, Round 1, confidence 0.9+ across
      # all 3 perspectives).
      - name: Validate tag format strictly
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$RAW_TAG' does not match strict vMAJOR.MINOR.PATCH format"
            exit 1
          fi

      # Pinned like the bridge job's actions: this job publishes the
      # executable with contents: write.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Derive tag/version
        id: version
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag points at a commit already on main
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag is not an ancestor of main. Refusing to release an unreviewed/un-merged commit."
            exit 1
          fi

      # Read from the TAGGED commit specifically (git show "$GITHUB_SHA:...")
      # rather than whatever main happens to be checked out to later — main
      # can move between the tag being pushed and this job running (or on a
      # delayed/retried run), and the release asset must describe the exact
      # commit it was built from (Codex code review, Round 1, confidence
      # 0.9+ across all 3 perspectives).
      - name: Snapshot package.json/CHANGELOG.md from the tagged commit
        id: snapshot
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git show "$GITHUB_SHA:package/package.json" > dist/package.json.snapshot

          PKG_VERSION=$(jq -r '.version' dist/package.json.snapshot)
          PKG_NAME=$(jq -r '.name' dist/package.json.snapshot)
          # Belt-and-braces: PKG_NAME only reaches this workflow via a
          # merged-to-main package.json, but a stray "/" or newline would
          # otherwise corrupt $GITHUB_OUTPUT or the zip asset path/URL
          # (Codex code review, Round 3, confidence 0.87, SUGGESTION).
          if [[ ! "$PKG_NAME" =~ ^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$ ]]; then
            echo "::error::package/package.json name '$PKG_NAME' at the tagged commit is not a safe lowercase dotted identifier"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package/package.json version ($PKG_VERSION) at the tagged commit does not match tag version ($VERSION)"
            exit 1
          fi

          if ! git show "$GITHUB_SHA:package/CHANGELOG.md" | grep -qF "## [$VERSION]"; then
            echo "::error::package/CHANGELOG.md at the tagged commit has no '## [$VERSION]' heading"
            exit 1
          fi

          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"

      # `git archive` builds the zip directly from git's object database
      # (not the working tree), so a plain `find | zip` of the checked-out
      # working tree is NOT reproducible (filesystem mtimes vary per
      # checkout — confirmed empirically, Codex code review Round 1 v2,
      # confidence 0.85). `<commit>:package` archives the CONTENTS of
      # package/ at the zip root, with no wrapper folder.
      #
      # git normally derives zip entry mtimes from the referenced commit's
      # own committer time automatically — but ONLY when the archived
      # tree-ish IS a commit. `<commit>:<path>` resolves to a bare TREE
      # object (not the commit), so that auto-derivation does not kick in
      # and git falls back to the CURRENT wall-clock time instead — this was
      # NOT caught by an earlier same-second local re-run (both builds
      # happened to land in the same second by coincidence), but WAS caught
      # by rebuilding a second time after a real delay: two `git archive`
      # calls 65s apart produced two different SHA-256 hashes with 1-minute-
      # apart zip entry timestamps (Codex code review, Round 1 v3, confidence
      # 0.85, then verified locally). `--mtime` pins it explicitly to the
      # commit's own committer time, confirmed reproducible across a 5s gap.
      - name: Build zip from the tagged commit (package/ contents at the root, no wrapper folder)
        id: zip
        env:
          PKG_NAME: ${{ steps.snapshot.outputs.pkg_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="${PKG_NAME}-${VERSION}.zip"
          COMMIT_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          git archive --format=zip --mtime="@$COMMIT_EPOCH" --output "dist/$ASSET" "$GITHUB_SHA:package"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Verify zip structure
        env:
          ASSET: ${{ steps.zip.outputs.asset }}
        run: |
          unzip -Z1 "dist/$ASSET" | grep -qx "package.json"
          if unzip -Z1 "dist/$ASSET" | grep -q "^package/"; then
            echo "::error::zip contains a package/ wrapper directory; VPM/UPM expects package.json at the zip root"
            exit 1
          fi

      - name: Compute SHA-256
        id: hash
        env:
          ASSET: ${{ steps.zip.outputs.asset }}
        run: |
          echo "sha256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Into its own directory, so nothing else in dist/ can be mistaken for
      # the artifact. Since v8, download-artifact fails on an archive digest
      # mismatch by default; `digest-mismatch: error` keeps that explicit.
      # That digest only covers the zip between upload and download, so the
      # raw executable is still compared with the hash the bridge job
      # attested, and anything else fails the run.
      - name: Download the Bridge executable built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-exe
          path: dist/bridge-artifact
          digest-mismatch: error

      - name: Verify the Bridge executable matches the attested hash
        id: bridge
        env:
          EXPECTED: ${{ needs.bridge.outputs.sha256 }}
        run: |
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::bridge job output is not a SHA-256: '$EXPECTED'"
            exit 1
          fi
          if [ "$(find dist/bridge-artifact -type f | wc -l)" -ne 1 ] || \
             [ ! -f dist/bridge-artifact/VRCRemoteTest.Bridge.exe ]; then
            echo "::error::The bridge-exe artifact must contain exactly VRCRemoteTest.Bridge.exe"
            exit 1
          fi
          ACTUAL=$(sha256sum dist/bridge-artifact/VRCRemoteTest.Bridge.exe | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Downloaded Bridge executable ($ACTUAL) does not match the attested build ($EXPECTED)"
            exit 1
          fi
          cp dist/bridge-artifact/VRCRemoteTest.Bridge.exe dist/VRCRemoteTest.Bridge.exe
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG (tagged commit)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG headings carry a trailing " - <date>" (e.g.
          # "## [0.2.0] - 2026-09-03"), so match on the line STARTING with
          # "## [<version>]" rather than an exact full-line match — an exact
          # match silently produced empty release notes (Codex code review,
          # Round 3, confidence 0.87; verified locally: the exact-match form
          # emitted 0 bytes against this repo's real CHANGELOG.md).
          git show "$GITHUB_SHA:package/CHANGELOG.md" | \
            awk -v prefix="## [$VERSION]" '
              index($0, prefix) == 1 {flag=1; next}
              /^## \[/{if(flag) exit}
              flag
            ' > dist/release-notes.md

      # The hash a Windows user passes to install-bridge.ps1 -ExpectedSha256,
      # and the exact verification policy for the attestation. Notes are only
      # set when the release is created; recovery never rewrites them.
      - name: Append the Windows Bridge section to the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          BRIDGE_SHA256: ${{ steps.bridge.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo
            echo "## Windows Bridge"
            echo
            echo "- \`VRCRemoteTest.Bridge.exe\` SHA-256: \`$BRIDGE_SHA256\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Built and attested by: $RUN_URL"
            echo
            echo "Verify on Windows with GitHub CLI 2.102.0 or later before installing (see docs/setup-windows.md):"
            echo
            echo '```powershell'
            echo "gh attestation verify .\\VRCRemoteTest.Bridge.exe --repo $REPO --signer-workflow $REPO/.github/workflows/release-package.yml --source-ref refs/tags/$TAG --source-digest $GITHUB_SHA --deny-self-hosted-runners"
            echo '```'
          } >> dist/release-notes.md

      - name: Build the version entry JSON (fixed snapshot, reused for the release and index.json)
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.zip.outputs.asset }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          jq --arg url "https://github.com/$REPO/releases/download/$TAG/$ASSET" \
             --arg sha "$SHA256" \
             '. + {url: $url, zipSHA256: $sha}' dist/package.json.snapshot > dist/version-entry.json

      # Re-check that the tag still points at the commit this run was
      # triggered for. If a run for commit A is queued (e.g. behind the
      # concurrency group) and the tag gets deleted and re-pushed at commit
      # B before this step runs, `gh release create --verify-tag` only
      # checks the tag EXISTS — not that it still points at A — so it would
      # otherwise happily publish a release/asset built from the now-stale
      # commit A under the tag name that actually points at B (Codex code
      # review, Round 3, confidence 0.87).
      #
      # Tags in this repo are ANNOTATED (e.g. v0.2.0 — confirmed via `git
      # cat-file -t v0.2.0` => "tag", not "commit"). For an annotated tag,
      # `refs/tags/<tag>` in `git ls-remote` is the TAG OBJECT's own SHA, not
      # the commit it points to — while `$GITHUB_SHA` is documented by
      # GitHub Actions as the commit SHA. Comparing them directly would fail
      # every single release (confirmed empirically against this repo's own
      # v0.2.0 tag: `refs/tags/v0.2.0` and `refs/tags/v0.2.0^{}` resolve to
      # two different SHAs — Codex code review, Round 1 v2, confidence
      # 0.9+, independently found by 2 of 3 perspectives). Request the
      # peeled ref explicitly and fall back to the direct SHA for the rare
      # case of a lightweight tag.
      - name: Re-verify the tag has not moved since checkout
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          TRIGGERED_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
          CURRENT_COMMIT=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | \
            awk -v tag="refs/tags/$TAG" '
              $2 == tag {direct=$1}
              $2 == tag "^{}" {peeled=$1}
              END {print (peeled != "") ? peeled : direct}
            ')
          if [ -z "$CURRENT_COMMIT" ]; then
            echo "::error::Tag $TAG no longer exists on origin."
            exit 1
          fi
          if [ "$CURRENT_COMMIT" != "$TRIGGERED_COMMIT" ]; then
            echo "::error::Tag $TAG now resolves to commit $CURRENT_COMMIT, not the commit this run was triggered for ($TRIGGERED_COMMIT). The tag was moved after this run started; aborting rather than publishing a release built from a stale commit."
            exit 1
          fi

      # Idempotent and fail-closed for both assets (the VPM zip and the Bridge
      # executable). If the release already exists — a previous run created
      # it but failed before updating index.json, or this run is a retry — it
      # must be published (not a leftover draft), and every asset already on
      # it must be fully uploaded with exactly the digest this run expects.
      # Only genuinely absent assets are uploaded; an incomplete or different
      # asset stops the run instead of being overwritten (zip-only history:
      # Codex code review, Round 1 v2 confidence 0.8, Round 2 0.85, Round 3
      # 0.87).
      #
      # A full re-run rebuilds the Bridge executable, which is not
      # reproducible, so its digest can legitimately differ from the one
      # already published. Recover with "Re-run failed jobs" (it reuses the
      # bridge job's 7-day artifact). If the published executable differs,
      # release a new version: the notes already carry the published hash,
      # and immutable releases cannot change anyway. index.json is only
      # updated after the complete set has been verified (Codex plan review,
      # Bridge CI release, Rounds 1-2).
      - name: Create GitHub Release (idempotent, verified)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.zip.outputs.asset }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          BRIDGE_SHA256: ${{ steps.bridge.outputs.sha256 }}
        run: |
          declare -A EXPECTED=(
            ["$ASSET"]="sha256:$SHA256"
            ["VRCRemoteTest.Bridge.exe"]="sha256:$BRIDGE_SHA256"
          )

          if gh release view "$TAG" --json isDraft >/tmp/existing-release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' /tmp/existing-release.json)" = "true" ]; then
              echo "::error::Release $TAG exists as an unpublished draft (a previous run's gh release create likely failed partway through). Delete the draft manually and re-run, rather than risk publishing an incomplete release automatically."
              exit 1
            fi

            # The REST endpoint reports each asset's upload state as well as
            # its digest; it only returns published releases, and drafts were
            # rejected above.
            gh api "repos/$REPO/releases/tags/$TAG" > /tmp/existing-release.json

            # Classify every asset before changing anything.
            MISSING=()
            for NAME in "${!EXPECTED[@]}"; do
              MATCHES=$(jq --arg n "$NAME" '[.assets[] | select(.name == $n)] | length' /tmp/existing-release.json)
              if [ "$MATCHES" -eq 0 ]; then
                MISSING+=("$NAME")
                continue
              fi

              STATE=$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .state' /tmp/existing-release.json)
              DIGEST=$(jq -r --arg n "$NAME" '.assets[] | select(.name == $n) | .digest // empty' /tmp/existing-release.json)
              if [ "$STATE" != "uploaded" ] || [ -z "$DIGEST" ]; then
                echo "::error::Release $TAG has an incomplete $NAME asset (state '$STATE', digest '$DIGEST'). Delete that asset manually and use 'Re-run failed jobs' (which re-publishes the same attested bytes); if the release is immutable, release a new version instead."
                exit 1
              fi
              if [ "$DIGEST" != "${EXPECTED[$NAME]}" ]; then
                echo "::error::Release $TAG already has $NAME with digest $DIGEST, but this run produced ${EXPECTED[$NAME]}. Refusing to overwrite a published asset. A full re-run rebuilds the Bridge executable and is not reproducible; release a new version instead (the published notes carry the published hash)."
                exit 1
              fi
            done

            for NAME in "${MISSING[@]}"; do
              echo "Release $TAG is missing $NAME; uploading it now."
              if ! gh release upload "$TAG" "dist/$NAME"; then
                echo "::error::Could not upload $NAME to the existing release $TAG. If immutable releases are enabled, assets cannot be added after publication; release a new version instead."
                exit 1
              fi
            done
          else
            gh release create "$TAG" "dist/$ASSET" dist/VRCRemoteTest.Bridge.exe \
              --verify-tag --title "$TAG" --notes-file dist/release-notes.md
          fi

          # Verify the complete published set before index.json points at it.
          # Retried briefly in case asset metadata lags right after upload.
          for ATTEMPT in 1 2 3 4 5; do
            ALL_MATCH=true
            # A transient API failure is retried like lagging metadata rather
            # than aborting under bash -e (Codex code review, Bridge CI
            # release, Round 2).
            if ! gh api "repos/$REPO/releases/tags/$TAG" > /tmp/final-release.json; then
              echo "Attempt $ATTEMPT: could not read release $TAG."
              echo '{"assets":[]}' > /tmp/final-release.json
            fi
            for NAME in "${!EXPECTED[@]}"; do
              DIGEST=$(jq -r --arg n "$NAME" '[.assets[] | select(.name == $n and .state == "uploaded") | .digest] | first // empty' /tmp/final-release.json)
              if [ "$DIGEST" != "${EXPECTED[$NAME]}" ]; then
                ALL_MATCH=false
                echo "Attempt $ATTEMPT: $NAME on $TAG has digest '$DIGEST', expected ${EXPECTED[$NAME]}."
              fi
            done
            if [ "$ALL_MATCH" = true ]; then
              echo "Release $TAG carries both assets with the expected digests."
              break
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "::error::Release $TAG does not carry the expected assets after publication."
              exit 1
            fi
            sleep $((ATTEMPT * 3))
          done

      # Idempotent (git diff --quiet short-circuits a no-op) and retried on
      # a push race against another concurrent run (moot under the
      # single-slot `concurrency:` group above, but cheap defense in depth).
      - name: Update index.json on main
        env:
          PKG_NAME: ${{ steps.snapshot.outputs.pkg_name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git checkout -B main origin/main

            jq --slurpfile entry dist/version-entry.json \
               --arg name "$PKG_NAME" --arg ver "$VERSION" \
               '.packages[$name].versions[$ver] = $entry[0]' index.json > index.json.tmp
            mv index.json.tmp index.json
            jq empty index.json

            if git diff --quiet index.json; then
              echo "index.json already up to date for $TAG; nothing to commit."
              break
            fi

            git add index.json
            git commit -m "Add VPM listing for $TAG"

            if git push origin HEAD:main; then
              echo "Pushed index.json update."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push index.json update after 5 attempts."
              exit 1
            fi
            echo "Push failed (attempt $attempt), retrying after fetch..."
            git reset --hard origin/main
            sleep $((attempt * 3))
          done
