name: Bridge tests

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false — this job runs `dotnet test` against
      # PR-submitted code (untrusted for pull_request from forks); no step
      # here needs to push or authenticate to GitHub, so don't leave a
      # checkout token sitting in the workspace for that code to read
      # (Codex code review, Round 1 v2, confidence 0.8).
      #
      # Pinned to the same commits as release-package.yml's bridge job, which
      # only runs on a tag push, so this workflow is where a change to those
      # actions gets exercised before a release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: dotnet test
        working-directory: bridge
        run: dotnet test VRCRemoteTest.Bridge.sln --configuration Release
